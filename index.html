<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="금토 잠자리" />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>금토 잠자리 순서</title>
  <style>
    :root{--bg:#f4f6fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
    .hero{background:linear-gradient(145deg,#111827,#374151);color:#fff;border-radius:26px;padding:22px;box-shadow:0 14px 34px rgba(17,24,39,.16);margin-bottom:14px}
    .eyebrow{font-size:13px;opacity:.72;margin-bottom:6px}h1{font-size:28px;line-height:1.15;margin:0 0 8px}.date{font-size:15px;opacity:.9}
    .grid{display:grid;gap:10px;margin-top:14px}.role{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.role .label{font-size:14px;opacity:.78}.role .name{font-weight:800;font-size:21px}
    .primary{width:100%;border:0;border-radius:18px;padding:17px 18px;margin-top:14px;background:#fff;color:#111827;font-size:17px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.12)}.primary:active{transform:scale(.99)}
    .card{background:var(--card);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 8px 24px rgba(17,24,39,.06)}.card h2{font-size:18px;margin:0 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button.secondary{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 12px;font-weight:700;font-size:15px}.history{display:grid;gap:9px}.history-item{border:1px solid var(--line);border-radius:16px;padding:13px 14px}.history-date{font-weight:800;font-size:14px;margin-bottom:6px}.history-text{font-size:14px;color:#374151;line-height:1.55}.empty{color:var(--muted);font-size:14px;padding:8px 0}
    details{margin-top:14px}summary{font-weight:800;cursor:pointer}.settings{display:grid;gap:10px;margin-top:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;background:#fff}.tiny{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}.danger{color:#b91c1c}
    .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111827;color:white;padding:11px 15px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">우리집 금·토 잠자리</div>
    <h1>오늘은 누가 고를까?</h1>
    <div class="date" id="todayText"></div>
    <div class="grid">
      <div class="role"><span class="label">📺 TV 고르기</span><span class="name" id="tvName">하랑</span></div>
      <div class="role"><span class="label">🛏️ 자리 1순위</span><span class="name" id="seat1Name">세하</span></div>
      <div class="role"><span class="label">🛏️ 자리 2순위</span><span class="name" id="seat2Name">건우</span></div>
    </div>
    <button class="primary" id="confirmBtn">오늘 순서 확정하기</button>
  </section>
  <section class="card"><h2>빠른 기능</h2><div class="actions"><button class="secondary" id="shareBtn">🖼️ 이미지 공유</button><button class="secondary" id="undoBtn">↩️ 마지막 기록 취소</button></div><div class="tiny">처음은 하랑 → 세하 → 건우로 시작합니다. 한 번 확정할 때마다 다음 사용을 위해 역할이 한 칸씩 돌아갑니다.</div></section>
  <section class="card"><h2>히스토리</h2><div id="history" class="history"></div></section>
  <section class="card"><details><summary>이름 설정</summary><div class="settings"><div class="field"><label>첫째</label><input id="name1" value="하랑"></div><div class="field"><label>둘째</label><input id="name2" value="세하"></div><div class="field"><label>셋째</label><input id="name3" value="건우"></div><button class="secondary" id="saveNamesBtn">이름 저장</button></div></details><details><summary class="danger">초기화</summary><div class="tiny">모든 히스토리와 현재 순서를 처음 상태로 되돌립니다.</div><button class="secondary danger" id="resetBtn" style="margin-top:10px;width:100%">전체 초기화</button></details></section>
</div><div class="toast" id="toast"></div>
<script>
(()=>{const KEY='kidsSleepRotation_v1';const defaultState={names:['하랑','세하','건우'],rotation:0,history:[]};let state=load();const $=id=>document.getElementById(id);const clone=o=>JSON.parse(JSON.stringify(o));
const fmtDate=(d=new Date())=>{const days=['일','월','화','수','목','금','토'];return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`};
const fmtShort=iso=>{const d=new Date(iso),days=['일','월','화','수','목','금','토'];return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.names)?x:clone(defaultState)}catch(e){return clone(defaultState)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function currentOrder(){const n=state.names,r=((state.rotation%3)+3)%3;return[n[r],n[(r+1)%3],n[(r+2)%3]]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){todayText.textContent=fmtDate();const[tv,s1,s2]=currentOrder();tvName.textContent=tv;seat1Name.textContent=s1;seat2Name.textContent=s2;name1.value=state.names[0];name2.value=state.names[1];name3.value=state.names[2];history.innerHTML='';if(!state.history.length){history.innerHTML='<div class="empty">아직 기록이 없어요. 오늘 순서를 확정하면 여기에 저장됩니다.</div>';return}[...state.history].reverse().forEach(item=>{const div=document.createElement('div');div.className='history-item';div.innerHTML=`<div class="history-date">${fmtShort(item.date)}</div><div class="history-text">📺 TV: <b>${esc(item.tv)}</b> · 🛏️ 자리 1순위: <b>${esc(item.seat1)}</b> · 자리 2순위: <b>${esc(item.seat2)}</b></div>`;history.appendChild(div)})}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1700)}
confirmBtn.onclick=()=>{const[tv,s1,s2]=currentOrder();state.history.push({date:new Date().toISOString(),tv,seat1:s1,seat2:s2,rotation:state.rotation});state.rotation=(state.rotation+1)%3;save();render();toast('오늘 순서를 저장했어요')};
undoBtn.onclick=()=>{if(!state.history.length){toast('취소할 기록이 없어요');return}const last=state.history.pop();state.rotation=last.rotation;save();render();toast('마지막 기록을 취소했어요')};
saveNamesBtn.onclick=()=>{const vals=[name1.value.trim(),name2.value.trim(),name3.value.trim()];if(vals.some(v=>!v)){toast('이름 3개를 모두 입력해 주세요');return}state.names=vals;save();render();toast('이름을 저장했어요')};
resetBtn.onclick=()=>{if(confirm('모든 기록을 지우고 처음 상태로 돌아갈까요?')){state=clone(defaultState);save();render();toast('초기화했어요')}};
shareBtn.onclick=async()=>{const[tv,s1,s2]=currentOrder();const text=`${fmtDate()}\n📺 TV: ${tv}\n🛏️ 자리 1순위: ${s1}\n🛏️ 자리 2순위: ${s2}`;if(navigator.share){try{await navigator.share({title:'오늘의 잠자리 순서',text})}catch(e){}}else{await navigator.clipboard.writeText(text);toast('공유 내용을 복사했어요')}};
if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}render()})();
</script></body></html>
