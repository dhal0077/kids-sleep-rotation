<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="금토 잠자리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>금토 잠자리 순서</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#166534;--okbg:#dcfce7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}.hero{background:linear-gradient(145deg,#111827,#374151);color:#fff;border-radius:26px;padding:22px;box-shadow:0 14px 34px rgba(17,24,39,.16);margin-bottom:14px}.eyebrow{font-size:13px;opacity:.72;margin-bottom:6px}h1{font-size:28px;line-height:1.15;margin:0 0 8px}.date{font-size:15px;opacity:.9}.grid{display:grid;gap:10px;margin-top:14px}.role{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.role .label{font-size:14px;opacity:.78}.role .name{font-weight:800;font-size:21px}.primary{width:100%;border:0;border-radius:18px;padding:17px 18px;margin-top:14px;background:#fff;color:#111827;font-size:17px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.12)}.primary:active:not(:disabled){transform:scale(.99)}.primary:disabled{background:var(--okbg);color:var(--ok);box-shadow:none}.card{background:var(--card);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 8px 24px rgba(17,24,39,.06)}.card h2{font-size:18px;margin:0 0 12px}button.secondary{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 12px;font-weight:700;font-size:15px}.history{display:grid;gap:9px}.history-item{border:1px solid var(--line);border-radius:16px;padding:13px 14px}.history-date{font-weight:800;font-size:14px;margin-bottom:6px}.history-text{font-size:14px;color:#374151;line-height:1.55}.empty{color:var(--muted);font-size:14px;padding:8px 0}.tiny{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111827;color:white;padding:11px 15px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="eyebrow">우리집 금·토 잠자리</div>
<h1>오늘은 누가 고를까?</h1>
<div class="date" id="todayText"></div>
<div class="grid">
<div class="role"><span class="label">📺 TV 고르기</span><span class="name" id="tvName">하랑</span></div>
<div class="role"><span class="label">🛏️ 자리 1순위</span><span class="name" id="seat1Name">세하</span></div>
<div class="role"><span class="label">🛏️ 자리 2순위</span><span class="name" id="seat2Name">건우</span></div>
</div>
<button class="primary" id="confirmBtn" type="button">오늘 순서 확정하기</button>
</section>
<section class="card"><h2>공유</h2><button class="secondary" id="shareBtn" type="button">📤 오늘 순서 공유</button><div class="tiny">오늘 순서는 하루에 한 번만 확정할 수 있습니다. 확정 후에는 다음 날까지 바뀌지 않습니다.</div></section>
<section class="card"><h2>히스토리</h2><div id="history" class="history"></div></section>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const KEY='kidsSleepRotation_v3';
const OLD_KEY='kidsSleepRotation_v2';
const NAMES=['하랑','세하','건우'];
const DEFAULT={rotation:0,history:[]};
const $=id=>document.getElementById(id);
const el={today:$('todayText'),tv:$('tvName'),s1:$('seat1Name'),s2:$('seat2Name'),confirm:$('confirmBtn'),share:$('shareBtn'),history:$('history'),toast:$('toast')};
const clone=o=>JSON.parse(JSON.stringify(o));
function localKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function itemDay(item){if(item.localDate)return item.localDate;const d=new Date(item.date);return localKey(d)}
function migrate(){try{const old=JSON.parse(localStorage.getItem(OLD_KEY));if(old&&Array.isArray(old.history)){const today=localKey(new Date());return{rotation:0,history:old.history.filter(x=>itemDay(x)!==today)}}}catch(e){}return clone(DEFAULT)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.history)?x:migrate()}catch(e){return migrate()}}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function orderForRotation(r){return[NAMES[r%3],NAMES[(r+1)%3],NAMES[(r+2)%3]]}
function todayRecord(){const k=localKey(new Date());return state.history.find(x=>itemDay(x)===k)||null}
function displayOrder(){const rec=todayRecord();return rec?[rec.tv,rec.seat1,rec.seat2]:orderForRotation(state.rotation)}
function dateText(d){const days=['일','월','화','수','목','금','토'];return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`}
function shortDate(item){const d=new Date(item.date),days=['일','월','화','수','목','금','토'];return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`}
function showToast(msg){el.toast.textContent=msg;el.toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.toast.classList.remove('show'),1600)}
function render(){
  el.today.textContent=dateText(new Date());
  const [tv,s1,s2]=displayOrder();el.tv.textContent=tv;el.s1.textContent=s1;el.s2.textContent=s2;
  const locked=!!todayRecord();el.confirm.disabled=locked;el.confirm.textContent=locked?'오늘 순서 확정됨 ✓':'오늘 순서 확정하기';
  el.history.innerHTML='';
  if(!state.history.length){el.history.innerHTML='<div class="empty">아직 기록이 없어요. 오늘 순서를 확정하면 여기에 저장됩니다.</div>';return}
  state.history.slice().reverse().forEach(item=>{const div=document.createElement('div');div.className='history-item';const d=document.createElement('div');d.className='history-date';d.textContent=shortDate(item);const t=document.createElement('div');t.className='history-text';t.textContent=`📺 TV: ${item.tv} · 🛏️ 자리 1순위: ${item.seat1} · 자리 2순위: ${item.seat2}`;div.append(d,t);el.history.appendChild(div)});
}
el.confirm.addEventListener('click',function(){
  if(todayRecord()){showToast('오늘 순서는 이미 확정됐어요');render();return}
  const [tv,s1,s2]=orderForRotation(state.rotation);const now=new Date();
  state.history.push({date:now.toISOString(),localDate:localKey(now),tv:tv,seat1:s1,seat2:s2,rotation:state.rotation});
  state.rotation=(state.rotation+1)%3;save();render();showToast('오늘 순서를 확정했어요');
});
el.share.addEventListener('click',async function(){const [tv,s1,s2]=displayOrder();const text=`${dateText(new Date())}\n📺 TV: ${tv}\n🛏️ 자리 1순위: ${s1}\n🛏️ 자리 2순위: ${s2}`;try{if(navigator.share){await navigator.share({title:'오늘의 잠자리 순서',text:text})}else if(navigator.clipboard){await navigator.clipboard.writeText(text);showToast('공유 내용을 복사했어요')}}catch(e){}});
save();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
})();
</script>
</body>
</html>
